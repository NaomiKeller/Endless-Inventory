//todo compare with multi-loader's common build
plugins {
    id 'java-library'
    id 'idea'
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
}

group = mod_group_id
version = mod_version

subprojects {
    repositories {
        mavenCentral()
    }

    java {
        toolchain.languageVersion.set(JavaLanguageVersion.of(java_version))
    }

    base {
        archivesName.set(mod_id)
    }

    // IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }

    repositories {
        mavenCentral()
        // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = 'https://repo.spongepowered.org/repository/maven-public'
                }
            }
            filter { includeGroupAndSubgroups('org.spongepowered') }
        }
        exclusiveContent {
            forRepositories(
                    maven {
                        name = 'ParchmentMC'
                        url = 'https://maven.parchmentmc.org/'
                    },
                    maven {
                        name = "NeoForge"
                        url = 'https://maven.neoforged.net/releases'
                    }
            )
            filter { includeGroup('org.parchmentmc.data') }
        }
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
        }
    }

    processResources {
        var expandProps = [
                'version'                      : version,
                'group'                        : project.group, //Else we target the task's group.
                'minecraft_version'            : minecraft_version,
                'minecraft_version_range'      : minecraft_version_range,
                'fabric_version'               : fabric_version,
                'fabric_loader_version'        : fabric_loader_version,
                'mod_name'                     : mod_name,
                'mod_author'                   : mod_author,
                'mod_id'                       : mod_id,
                'license'                      : license,
                'description'                  : project.description,
                "forge_version"                : forge_version,
                "forge_loader_version_range"   : forge_loader_version_range,
                'credits'                      : credits,
                'java_version'                 : java_version
        ]

        var jsonExpandProps = expandProps.collectEntries {
            key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
        }

        filesMatching(['META-INF/mods.toml']) {
            expand expandProps
        }

        filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
            expand jsonExpandProps
        }

        inputs.properties(expandProps)
    }
}

