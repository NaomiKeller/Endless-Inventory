plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'idea'
    id 'java'

    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}
base {
    archivesName = "${mod_name}-${project.name}-${minecraft_version}-${mod_version}"
}
loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    // Mixin annotation processor is disabled by default in Loom 1.13+.
    // Avoid configuring legacy AP to reduce noisy mixin compile-time warnings.
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/resources')
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Cloth Config"
        url = "https://maven.shedaniel.me/"
    }
}
dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation(project(":common")) {
        exclude group: "net.minecraftforge"
    }
    //include(project(":common"))
    //jarJar project(":common")
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // No explicit mixin annotation processor; Loom handles remapping.
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    //fabric 1.21.8 Jei
    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}
processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            "loader_version"       : fabric_loader_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.property "version", project.version
    inputs.properties replaceProperties
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}
def targetJavaVersion = Integer.parseInt(java_version)
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':common').sourceSets.main.output)
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

publishMods {
    file = remapJar.archiveFile
    changelog = "26/3/20 fixed soft lock on toggle closing attached inventory. And trying mod publish plugin."
    displayName.set(base.archivesName)
    version = mod_version
    type = BETA
    modLoaders.add("fabric")

    curseforge {
        projectId = curseforge_project_id
        projectSlug = "endless-inventory" // Required for discord webhook
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.toVersion(java_version))
        requires("fabric-api")
    }
    modrinth {
        projectId = modrinth_project_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
//        minecraftVersionRange {
//            start = "1.19.4"
//            end = "1.20.2" // Set to "latest" to use the latest minecraft version
//
//            // Optionally include snapshot versions, defaults to false
//            includeSnapshots = true
//        }
        optional("jei")
    }
//    github {
//        repository = "test/example"
//        accessToken = providers.environmentVariable("GITHUB_TOKEN")
//        commitish = "main"
//    }
//    discord {
//        webhookUrl = providers.environmentVariable("DISCORD_WEBHOOK")
//    }
}

